name: Publish Nika Estate landings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared landing content and tracking
        run: node --test tests/*.test.cjs
      - name: Install Valia dependencies
        working-directory: valia-app
        run: npm ci --no-audit --no-fund
      - name: Verify lead tracking and translations
        working-directory: valia-app
        run: node --test tests/leads.test.cjs tests/locales.test.mjs
      - name: Build both languages
        working-directory: valia-app
        run: npx vite build
      - name: Install project landing dependencies
        working-directory: projects-app
        run: npm ci --no-audit --no-fund
      - name: Verify project landings and confirmed lead delivery
        working-directory: projects-app
        run: npm test
      - name: Build Russian project landings
        working-directory: projects-app
        run: npm run build
      - uses: actions/configure-pages@v5
      - name: Preserve existing landings and add Valia plus project pages
        run: |
          mkdir -p "$RUNNER_TEMP/pages/valia"
          rsync -a --exclude=.git --exclude=.github --exclude=valia-app --exclude=projects-app --exclude=tests ./ "$RUNNER_TEMP/pages/"
          cp -a valia-app/dist/client/. "$RUNNER_TEMP/pages/valia/"
          cp -a projects-app/dist/client/. "$RUNNER_TEMP/pages/"
          test -f "$RUNNER_TEMP/pages/index.html"
          test -f "$RUNNER_TEMP/pages/the-archive/index.html"
          test -f "$RUNNER_TEMP/pages/uae-webinar/index.html"
          test -f "$RUNNER_TEMP/pages/meeting-dubai/index.html"
          test -f "$RUNNER_TEMP/pages/meeting-cyprus/index.html"
          test -f "$RUNNER_TEMP/pages/webinar/uae/index.html"
          test -f "$RUNNER_TEMP/pages/webinar/cyprus/index.html"
          test -f "$RUNNER_TEMP/pages/webinar/greece/index.html"
          test -f "$RUNNER_TEMP/pages/cyprus/investment-memo/index.html"
          test -f "$RUNNER_TEMP/pages/valia/en/index.html"
          test -f "$RUNNER_TEMP/pages/central-park/index.html"
          test -f "$RUNNER_TEMP/pages/thyme/index.html"
          test -f "$RUNNER_TEMP/pages/jadeel/index.html"
          test -f "$RUNNER_TEMP/pages/havencia/index.html"
          test -f "$RUNNER_TEMP/pages/quiz/central-park/index.html"
          test -f "$RUNNER_TEMP/pages/quiz/thyme/index.html"
          test -f "$RUNNER_TEMP/pages/quiz/jadeel/index.html"
          test -f "$RUNNER_TEMP/pages/quiz/havencia/index.html"
          test -f "$RUNNER_TEMP/pages/project-assets/lead-capture.js"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy all landings
        id: deployment
        uses: actions/deploy-pages@v4
